<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const cookieName = 'sql_academy_session';
const send = (type, extra = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, '*');
let handled = null;
function readToken() {
  try {
    const value = document.cookie.split('; ').find(item => item.startsWith(cookieName + '='));
    if (value) return decodeURIComponent(value.slice(cookieName.length + 1));
  } catch (_) {}
  try { return localStorage.getItem(cookieName); } catch (_) { return null; }
}
window.addEventListener('message', (event) => {
  if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
  const command = event.data.args.command;
  if (!command || command.id === handled) return;
  const secure = location.protocol === 'https:' ? '; Secure' : '';
  if (command.action === 'set') {
    try { document.cookie = `${cookieName}=${encodeURIComponent(command.token)}; Path=/; Max-Age=${command.max_age}; SameSite=Lax${secure}`; } catch (_) {}
    try { localStorage.setItem(cookieName, command.token); } catch (_) {}
  } else if (command.action === 'delete') {
    try { document.cookie = `${cookieName}=; Path=/; Max-Age=0; SameSite=Lax${secure}`; } catch (_) {}
    try { localStorage.removeItem(cookieName); } catch (_) {}
  }
  const token = readToken();
  const ok = command.action === 'read' || (command.action === 'delete' ? !token : token === command.token);
  handled = command.id;
  const value = {id: command.id, ok};
  if (command.action === 'read') value.token = token;
  send('streamlit:setComponentValue', {value, dataType: 'json'});
});
send('streamlit:componentReady', {apiVersion: 1});
send('streamlit:setFrameHeight', {height: 0});
</script></body></html>
